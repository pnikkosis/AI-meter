# Manual check of the app on an Android EMULATOR from GitHub's runner (not a phone).
#
# 1. Runs the instrumented tests (debug build): WidgetScreenshotTest renders every widget state, and
#    CodexDeviceCodeExpiryTest decodes a device-code answer with that Android version's java.time.
# 2. Installs the R8-processed RELEASE build, signed with a throwaway key generated in this job (the
#    release key never reaches GitHub), and drives it with scripts/ci/emulator_smoke.py.
# A separate job prints the format of auth.openai.com's device-code answer with every value masked.
# Screenshots are printed base64-encoded at the end of the log. No credentials exist here: the Codex
# screen asks auth.openai.com for a device code (not captured) and the Claude screen opens claude.ai
# in the browser, as a user starting a sign-in would; both attempts are cancelled.
name: Emulator check (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  codex-answer-format:
    name: Codex device-code answer format (values masked)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ask auth.openai.com for a device code as the app does
        run: python3 scripts/ci/codex_device_code_shape.py

  emulator:
    name: Emulator API ${{ matrix.api }} (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            locale: es-AR
          - api: 31
            locale: en-US
    env:
      PKG: io.github.pnikkosis.aiusagewidget
      ANDROID_AVD_HOME: ${{ github.workspace }}/.avd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$ANDROID_HOME/ndk" || true
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" \
            "system-images;android-${{ matrix.api }};google_apis;x86_64" > /dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Build debug, instrumentation and release APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Sign the release APK with a throwaway key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.p12" -storetype PKCS12 \
            -storepass throwaway -keypass throwaway -alias throwaway -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=Throwaway emulator test key"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$RUNNER_TEMP/throwaway.p12" \
            --ks-pass pass:throwaway --out "$RUNNER_TEMP/release-throwaway.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Start emulator
        timeout-minutes: 20
        run: |
          set -x
          mkdir -p "$ANDROID_AVD_HOME"
          ls "$ANDROID_HOME/system-images/android-${{ matrix.api }}/google_apis/x86_64" | head
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd -n check -k "system-images;android-${{ matrix.api }};google_apis;x86_64" --force
          "$AVDMANAGER" list avd
          printf 'hw.lcd.width=720\nhw.lcd.height=1520\nhw.lcd.density=320\nhw.keyboard=yes\nhw.ramSize=3072\ndisk.dataPartition.size=3G\n' >> "$ANDROID_AVD_HOME/check.avd/config.ini"
          df -h / | tail -1
          nohup emulator -avd check -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          boot_wait() {
            timeout 300 adb wait-for-device || return 1
            timeout 900 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done' || return 1
            # The package manager can lag behind boot_completed.
            timeout 180 bash -c 'until adb shell pm path android > /dev/null 2>&1; do sleep 3; done'
          }
          boot_wait || { tail -n 80 "$RUNNER_TEMP/emulator.log"; exit 1; }
          if [ "${{ matrix.locale }}" != "en-US" ]; then
            # System locale via a persistent property and a reboot, so the framework does not
            # restart later while the tests are running (what -change-locale does).
            # adbd restarts as root; on a slow runner the first attempt can find it still closed.
            for attempt in 1 2 3; do adb root && break; sleep 10; adb wait-for-device; done
            sleep 5
            adb wait-for-device
            adb shell setprop persist.sys.locale "${{ matrix.locale }}"
            adb reboot
            sleep 20
            boot_wait || { tail -n 80 "$RUNNER_TEMP/emulator.log"; exit 1; }
          fi
          sleep 20
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard || true
          echo "Android $(adb shell getprop ro.build.version.release | tr -d '\r') (API $(adb shell getprop ro.build.version.sdk | tr -d '\r')), locale $(adb shell getprop persist.sys.locale | tr -d '\r')"
          adb shell pm list packages | grep -iE "chrome|browser|webview" || true

      - name: Instrumented tests (debug build)
        timeout-minutes: 10
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            for attempt in 1 2 3; do adb install -r "$apk" && break; sleep 15; done
          done
          adb shell am instrument -w \
            -e class com.kmnexus.codexmeter.widget.WidgetScreenshotTest,com.kmnexus.codexmeter.providers.codex.auth.CodexDeviceCodeExpiryTest \
            "$PKG.debug.test/androidx.test.runner.AndroidJUnitRunner" | tee "$RUNNER_TEMP/instrument.log"
          grep -q "^OK (3 tests)" "$RUNNER_TEMP/instrument.log"
          mkdir -p shots/widget
          for f in $(adb shell run-as "$PKG.debug" ls files/widget-shots | tr -d '\r'); do
            adb exec-out run-as "$PKG.debug" cat "files/widget-shots/$f" > "shots/widget/$f"
          done
          ls -l shots/widget

      - name: Drive the release build
        timeout-minutes: 15
        run: python3 scripts/ci/emulator_smoke.py "$RUNNER_TEMP/release-throwaway.apk" "$PKG" "${{ matrix.locale }}" shots/app

      - name: App log lines (credential-like values masked)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          if [ "$(adb get-state 2>/dev/null)" = "device" ]; then
            python3 scripts/ci/app_logcat.py "$PKG"
          else
            echo "no emulator connected"
            tail -n 80 "$RUNNER_TEMP/emulator.log" || true
          fi

      - name: Print screenshots
        if: ${{ !cancelled() }}
        run: |
          # Long lines keep the whole log within what log readers return (they cut by line count).
          for f in $(find shots -name '*.png' | sort); do
            name=$(echo "$f" | tr '/' '_')
            echo "=====BEGIN $name====="
            base64 -w 8000 "$f"
            echo "=====END $name====="
          done
