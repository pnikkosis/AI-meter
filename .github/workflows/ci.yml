# Verification build: unit tests, lint, debug APK and an UNSIGNED release APK.
# It uses no secrets and publishes nothing; the signed release APK is built locally with
# scripts/build-release.sh and the signing key that lives outside the repository.
name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-37|build-tools;37" || true

      - name: Record toolchain
        run: |
          java -version 2>&1
          ./gradlew --version
          sha256sum gradle/wrapper/gradle-wrapper.jar

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Unit test summary
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in files:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          print(f"test classes: {len(files)}, " + ", ".join(f"{k}: {v}" for k, v in totals.items()))
          EOF

      - name: Assemble debug and unsigned release APKs
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Lint
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Lint summary
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF'
          import collections
          import os
          import xml.etree.ElementTree as ET
          path = "app/build/reports/lint-results-debug.xml"
          if not os.path.exists(path):
              raise SystemExit("no lint XML report")
          issues = ET.parse(path).getroot().findall("issue")
          counts = collections.Counter((i.get("severity"), i.get("id")) for i in issues)
          for (severity, issue_id), n in sorted(counts.items()):
              print(f"{severity:14} {issue_id:45} {n}")
          print(f"total issues: {len(issues)}")
          # Details for everything except dependency-version and unused-resource noise.
          noise = {"GradleDependency", "NewerVersionAvailable", "AndroidGradlePluginVersion", "UseTomlInstead", "UnusedResources"}
          for i in issues:
              if i.get("id") not in noise:
                  loc = i.find("location")
                  where = f'{loc.get("file")}:{loc.get("line")}' if loc is not None else "?"
                  where = where.replace(os.getcwd() + "/", "")
                  print(f'{i.get("severity")}: {i.get("id")} at {where}: {i.get("message")}')
          EOF

      - name: APK checksums
        if: ${{ !cancelled() }}
        run: |
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \; || true
          ls -l app/build/outputs/apk/*/ || true

      - name: Release APK permissions and runtime dependencies
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):"
          echo "Components in the merged manifest:"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | python3 scripts/ci/manifest_components.py
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath | grep -E -- "--- " | sed -E 's/^[| \\+-]+//' | sort -u

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APKs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apks-unsigned-and-debug
          path: app/build/outputs/apk/
          retention-days: 14
          if-no-files-found: ignore
